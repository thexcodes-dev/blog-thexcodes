schema: https://api-us-east-1.hygraph.com/v2/cl70wn03820hs01ue9svqe0iw/master

documents: ./src/graphql/**/*.graphql

generates:
  ./src/graphql/generated.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config: 
      reactApolloVersion: 3
      withHooks: true
      withHOC: false
      withComponent: false