query GetPostsMostRead($first: Int, $skip: Int)  {
  posts(orderBy: views_DESC, first: $first, skip: $skip) {
    text {
      html
    }
    image {
      url
    }
    slug
    title
    description
    sessions {
      title
      slug
      color
      bgColor
    }
    teacher {
      name
    }
  }
}