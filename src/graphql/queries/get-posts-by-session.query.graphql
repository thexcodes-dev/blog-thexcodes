query GetPostsBySession ($slug: [String], $first: Int, $skip: Int) {
  posts(where: {sessions_some: {slug_in: $slug}}, orderBy: availableAt_DESC, first: $first, skip: $skip) {
    title
    slug
    description
    teacher {
      name
    }
    image {
      url
    }
    sessions {
      title
      color
      bgColor
    }
  }
  mostRead: posts(orderBy: views_DESC, first: 5, skip: 0) {
    title
    slug
    description
    teacher {
      name
    }
    image {
      url
    }
    sessions {
      title
      color
      bgColor
    }
  }
}
