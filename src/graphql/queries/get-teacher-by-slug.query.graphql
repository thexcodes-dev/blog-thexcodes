query GetTeacherBySlug ($slug: String, $first: Int, $skip: Int) {
  teacher(where: {slug: $slug}) {
    bio
    avatarUrl
    name
    slug
  }
  teachersConnection {
    edges {
      node {
        id
        posts(first: 100) {
          id
        }
      }
    }
  }
  posts(where: {teacher: {AND: {slug: "leandro-oliveira"}}}, orderBy: availableAt_DESC, first: $first, skip: $skip) {
    title
    slug
    description
    teacher { 
      name
    }
    imageUrl
    imageLabel
  }
}